<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <fieldset>

            <legend>Formulario de Registro</legend>

            <p>
                Nombre:
                <input type="text" size="40" maxlength="40" placeholder="Ingrese su nombre">
            </p>

            <p>
                Apellido:
                <input type="text" size="40" maxlength="40" placeholder="Ingrese su apellido">
            </p>

            <p>
                Sexo:
                Masculino
                <input type="radio" name="sexo" value="masculino" placeholder="Masculino">

                Femenino
                <input type="radio" name="sexo" value="femenino" placeholder="Femenino">
            </p>

            <p>
                Edad:
                <input type="number" maxlength="3" placeholder="Ingrese su edad">
            </p>

            <p>
                Email:
                <input type="email" size="40" maxlength="50" placeholder="Ingrese su email">
            </p>

            <p>
                Usuario:
                <input type="text" size="40" maxlength="30" placeholder="Ingrese su usuario">
            </p>

            <p>
                Password:
                <input type="password" size="40" maxlength="20" placeholder="Ingrese su contraseña">
            </p>

            <p>
                Confirmar Password:
                <input type="password" size="40" maxlength="20" placeholder="Confirme su contraseña">
            </p>

            <p>
                Tipo de servicio:

                <select>
                    <option>Free</option>
                    <option>Standard</option>
                    <option>Premium</option>
                </select>
            </p>

            <p>
                Tema:

                <input type="checkbox" value="politica" placeholder="Política"> Política

                <input type="checkbox" value="negocios" placeholder="Negocios"> Negocios

                <input type="checkbox" value="tecnologia" placeholder="Tecnología"> Tecnología

                <input type="checkbox" value="salud" placeholder="Salud"> Salud
            </p>

            <p>
                Agregue un comentario:
                <textarea maxlength="300" placeholder="Ingrese su comentario"></textarea>
            </p>

            <p>
                <input type="submit" value="Boton de Enviar" placeholder="Enviar">
            </p>

        </fieldset>

    </form>

</body>

</html>
