<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <fieldset>

            <legend>Datos Personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" size="40" maxlength="40"
                    placeholder="Ingrese su nombre">
            </p>

            <p>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" size="40" maxlength="40"
                    placeholder="Ingrese su apellido">
            </p>

            <p>
                Sexo:

                <label for="masculino">Masculino</label>
                <input type="radio" id="masculino" name="sexo" value="masculino">

                <label for="femenino">Femenino</label>
                <input type="radio" id="femenino" name="sexo" value="femenino">
            </p>

            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" maxlength="3"
                    placeholder="Ingrese su edad">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" size="40" maxlength="50"
                    placeholder="Ingrese su email">
            </p>

        </fieldset>


        <fieldset>

            <legend>Datos de la Cuenta</legend>

            <p>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" size="40" maxlength="30"
                    placeholder="Ingrese su usuario">
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" size="40" maxlength="20"
                    placeholder="Ingrese su contraseña">
            </p>

            <p>
                <label for="confirmarPassword">Confirmar Password:</label>
                <input type="password" id="confirmarPassword" size="40" maxlength="20"
                    placeholder="Confirme su contraseña">
            </p>

        </fieldset>


        <fieldset>

            <legend>Tipo de Suscripción</legend>

            <p>
                <label for="servicio">Tipo de servicio:</label>

                <select id="servicio">
                    <option>Free</option>
                    <option>Standard</option>
                    <option>Premium</option>
                </select>
            </p>

            <p>
                Tema:

                <input type="checkbox" id="politica" value="politica">
                <label for="politica">Política</label>

                <input type="checkbox" id="negocios" value="negocios">
                <label for="negocios">Negocios</label>

                <input type="checkbox" id="tecnologia" value="tecnologia">
                <label for="tecnologia">Tecnología</label>

                <input type="checkbox" id="salud" value="salud">
                <label for="salud">Salud</label>
            </p>

            <p>
                <label for="comentario">Agregue un comentario:</label>
                <textarea id="comentario" maxlength="300"
                    placeholder="Ingrese su comentario"></textarea>
            </p>

            <p>
                <input type="submit" value="Boton de Enviar">
            </p>

        </fieldset>

    </form>

</body>

</html>
