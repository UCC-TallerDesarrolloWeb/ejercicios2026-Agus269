<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <link rel="stylesheet" href="productos.css">

    <script type="text/javascript" src="../3-Js/tienda.js"></script>
    <script type="text/javascript" src="../3-Js/misFunciones.js"></script>
</head>

<body class="grid-container" onload="renderizarProductos()">

<header class="item1">
    <h1>Tienda de Productos</h1>
</header>

<nav class="item2">
    <button class="catalogo">Catalogo</button>
    <button class="carrito" onclick="window.location.href='carrito.html'">
        Carrito de Compras
    </button>
</nav>

<aside class="item3">

    <form>

        <fieldset>
            <legend>Busqueda</legend>

            <label for="buscar">Buscar:</label>
            <input type="text" id="buscar">
        </fieldset>

        <fieldset>
            <legend>Precios</legend>

            <p>
                <label for="minimo">Minimo:</label>
                <input type="number" id="minimo">
            </p>

            <p>
                <label for="maximo">Maximo:</label>
                <input type="number" id="maximo">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tipo de Productos</legend>

            <p>
                <input type="checkbox" id="protectores">
                <label for="protectores">Protectores</label>
            </p>

            <p>
                <input type="checkbox" id="entrenamiento">
                <label for="entrenamiento">Entrenamiento</label>
            </p>

            <p>
                <input type="checkbox" id="doboks">
                <label for="doboks">Doboks</label>
            </p>

        </fieldset>

    </form>

</aside>

<main class="item4">

    <div class="productos" id="productos">
    </div>

    <dialog id="dialogProducto">

        <div id="contenidoDialog">
        </div>

        <button type="button" onclick="cerrarDialog()">Cerrar</button>

    </dialog>

</main>

<footer class="item5">
    <p>Tienda de productos - 2026</p>
</footer>

</body>

</html>
