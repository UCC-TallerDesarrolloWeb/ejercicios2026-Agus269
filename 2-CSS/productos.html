<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="productos.css">
    <script type="text/javascript" src="misFunciones.js"></script>
</head>

<body class="grid-container">

<header class="item1">
    <h1>Tienda de Productos</h1>
</header>

<nav class="item2">
    <button class="catalogo">Catalogo</button>
    <button class="carrito">Carrito de Compras</button>
</nav>

<aside class="item3">

    <form>

        <fieldset>
            <legend>Busqueda</legend>

            <label for="buscar">Buscar:</label>
            <input type="text" id="buscar">
        </fieldset>

        <fieldset>
            <legend>Precios</legend>

            <p>
                <label for="minimo">Minimo:</label>
                <input type="number" id="minimo">
            </p>

            <p>
                <label for="maximo">Maximo:</label>
                <input type="number" id="maximo">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tipo de Productos</legend>

            <p>
                <input type="checkbox" id="protectores">
                <label for="protectores">Protectores</label>
            </p>

            <p>
                <input type="checkbox" id="entrenamiento">
                <label for="entrenamiento">Entrenamiento</label>
            </p>

            <p>
                <input type="checkbox" id="doboks">
                <label for="doboks">Doboks</label>
            </p>

        </fieldset>

    </form>

</aside>

<main class="item4">

    <div class="productos">

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp" alt="Cabezal Sparring">
            <h2>Cabezal Sparring</h2>
            <button type="button" onclick="abrirDialog()">Ver detalle de Producto</button>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="Dobok Dan">
            <h2>Dobok Dan</h2>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="Escudo de Potencia">
            <h2>Escudo de Potencia</h2>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="Par de focos redondos">
            <h2>Par de focos redondos</h2>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Guantes 10 onzas">
            <h2>Guantes 10 onzas</h2>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Protectores Pie">
            <h2>Protectores Pie</h2>
        </div>

    </div>

    <dialog id="dialogProducto">

        <h2>Detalle del Producto</h2>

        <p>
            Informacion detallada del producto seleccionado.
        </p>

        <button type="button" onclick="cerrarDialog()">Cerrar</button>

    </dialog>

</main>

<footer class="item5">
    <p>Tienda de productos - 2026</p>
</footer>

</body>
</html>
