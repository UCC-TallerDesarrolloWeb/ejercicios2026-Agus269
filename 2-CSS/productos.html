<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <link rel="stylesheet" href="productos.css">

    <script type="text/javascript" src="../3-Js/tienda.js"></script>
    <script type="text/javascript" src="../3-Js/misFunciones.js"></script>
</head>

<body class="grid-container" onload="filtrarProductos()">

<header class="item1">
    <h1>Tienda de Productos</h1>
</header>

<nav class="item2">

    <button class="catalogo">
        Catalogo
    </button>

    <button
        class="carrito"
        onclick="window.location.href='carrito.html'"
    >
        Carrito de Compras (<span id="contadorCarrito">0</span>)
    </button>

</nav>

<aside class="item3">

    <form>

        <fieldset>

            <legend>Busqueda</legend>

            <label for="buscar">Buscar:</label>

            <input
                type="text"
                id="buscar"
                oninput="filtrarProductos()"
            >

        </fieldset>

        <fieldset>

            <legend>Precios</legend>

            <p>
                <label for="minimo">Minimo:</label>

                <input
                    type="number"
                    id="minimo"
                    oninput="filtrarProductos()"
                >
            </p>

            <p>
                <label for="maximo">Maximo:</label>

                <input
                    type="number"
                    id="maximo"
                    oninput="filtrarProductos()"
                >
            </p>

        </fieldset>

        <fieldset>

            <legend>Marca</legend>

            <label for="marca">Seleccionar marca:</label>

            <select
                id="marca"
                onchange="filtrarProductos()"
            >
                <option value="">Todas</option>
                <option value="Gran Marc">Gran Marc</option>
                <option value="Daedo">Daedo</option>
            </select>

        </fieldset>

        <fieldset>

            <legend>Ordenar Catalogo</legend>

            <label for="orden">Ordenar por:</label>

            <select
                id="orden"
                onchange="filtrarProductos()"
            >
                <option value="">Sin ordenar</option>
                <option value="precioMenor">
                    Precio: menor a mayor
                </option>
                <option value="precioMayor">
                    Precio: mayor a menor
                </option>
                <option value="nombreAZ">
                    Nombre: A-Z
                </option>
                <option value="nombreZA">
                    Nombre: Z-A
                </option>
            </select>

        </fieldset>

        <fieldset>

            <legend>Tipo de Productos</legend>

            <p>
                <input
                    type="checkbox"
                    id="protectores"
                    onchange="filtrarProductos()"
                >

                <label for="protectores">
                    Protectores
                </label>
            </p>

            <p>
                <input
                    type="checkbox"
                    id="entrenamiento"
                    onchange="filtrarProductos()"
                >

                <label for="entrenamiento">
                    Entrenamiento
                </label>
            </p>

            <p>
                <input
                    type="checkbox"
                    id="dobok"
                    onchange="filtrarProductos()"
                >

                <label for="dobok">
                    Dobok
                </label>
            </p>

        </fieldset>

    </form>

</aside>

<main class="item4">

    <div
        class="productos"
        id="productos"
    >
    </div>

    <dialog id="dialogProducto">

        <div id="contenidoDialog">
        </div>

        <button
            type="button"
            onclick="cerrarDialog()"
        >
            Cerrar
        </button>

    </dialog>

</main>

<footer class="item5">

    <p>Tienda de productos - 2026</p>

</footer>

</body>

</html>
